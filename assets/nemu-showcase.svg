<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Nemu showcase</title>
  <desc id="desc">A Nemu-inspired dark collage with a product brief and a Companion plugin terminal window.</desc>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#BCA9FF" stroke-opacity=".10"/>
    </pattern>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".8" fill="#151526" fill-opacity=".13"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="1196" height="376" rx="24" fill="#151526" stroke="#6687FF" stroke-width="4"/>
  <rect x="2" y="2" width="1196" height="376" rx="24" fill="url(#grid)"/>
  <path d="M0 0h237l-24 22-52-7-32 25-58-13L0 50Z" fill="#B9A5FF"/>
  <path d="M1200 380H982l33-25 41 6 39-32 51 16 54-22Z" fill="#315CFF"/>

  <g transform="translate(50 40)">
    <path d="M14 11L500 0l-5 45 10 52-8 55 10 49-9 86-80-9-66 13-73-8-79 11-72-9-119 9 7-61-8-59 8-63-9-56Z" fill="#315CFF" opacity=".38" transform="translate(11 11)"/>
    <path d="M14 11L500 0l-5 45 10 52-8 55 10 49-9 86-80-9-66 13-73-8-79 11-72-9-119 9 7-61-8-59 8-63-9-56Z" fill="#F0EEE8"/>
    <path d="M14 11L500 0l-5 45 10 52-8 55 10 49-9 86-80-9-66 13-73-8-79 11-72-9-119 9 7-61-8-59 8-63-9-56Z" fill="url(#dots)"/>
    <rect x="72" y="-9" width="252" height="30" fill="#D9D5CC" transform="rotate(-2 72 -9)"/>
    <text x="83" y="12" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#151526">// SHIPPED FROM THE WORKBENCH</text>
    <text x="50" y="92" font-family="Impact, Arial Black, sans-serif" font-size="78" font-weight="900" fill="#151526" textLength="345" lengthAdjust="spacingAndGlyphs">NEMU</text>
    <text x="51" y="129" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#2E57F0" letter-spacing="1.2">SOFTWARE WITH LOGIC + PERSONALITY</text>
    <text x="51" y="175" font-family="Arial, sans-serif" font-size="18" fill="#4D4B5F">Product engineering, expressive interfaces,</text>
    <text x="51" y="201" font-family="Arial, sans-serif" font-size="18" fill="#4D4B5F">and account-scoped Codex integrations.</text>
    <g transform="translate(51 230)">
      <rect width="136" height="34" rx="7" fill="#151526"/>
      <text x="15" y="22" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#FFFFFF">NEMU.AE / LIVE</text>
      <rect x="149" width="206" height="34" rx="7" fill="#315CFF"/>
      <text x="164" y="22" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#FFFFFF">COMPANION / TEST RELEASE</text>
    </g>
  </g>

  <g transform="translate(617 52)">
    <rect x="12" y="14" width="519" height="281" rx="18" fill="#315CFF" opacity=".52"/>
    <rect width="519" height="281" rx="18" fill="#202039" stroke="#FBFAFF" stroke-width="3"/>
    <rect width="519" height="48" rx="18" fill="#2A2945"/>
    <rect y="32" width="519" height="16" fill="#2A2945"/>
    <circle cx="24" cy="24" r="6" fill="#FF78C8"/><circle cx="45" cy="24" r="6" fill="#FFD568"/><circle cx="66" cy="24" r="6" fill="#7EE7BD"/>
    <text x="93" y="29" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#D6DCFF">nemu companion / connected</text>
    <g transform="translate(28 76)" font-family="Courier New, monospace" font-size="15">
      <text x="0" y="0" fill="#7EE7BD">$</text><text x="20" y="0" fill="#FBFAFF">codex plugin add nemu@nemu</text>
      <text x="0" y="38" fill="#6687FF">✓</text><text x="25" y="38" fill="#B0AFC3">browser authorization complete</text>
      <text x="0" y="70" fill="#6687FF">✓</text><text x="25" y="70" fill="#B0AFC3">account-scoped access</text>
      <text x="0" y="102" fill="#6687FF">✓</text><text x="25" y="102" fill="#B0AFC3">provider credentials stay local</text>
      <rect x="0" y="130" width="458" height="50" rx="8" fill="#151526" stroke="#BCA9FF" stroke-opacity=".28"/>
      <text x="17" y="160" fill="#FFFFFF" font-weight="700">ready / ask Nemu what is connected</text>
    </g>
  </g>

  <g transform="translate(1085 20) rotate(9)">
    <path d="M0 22h20L28 0l9 22h23L43 35l8 23-23-13L8 58l7-23Z" fill="#FF78C8" stroke="#151526" stroke-width="3"/>
  </g>
  <path d="M565 322c14-18 28-20 42-2" fill="none" stroke="#FFD568" stroke-width="5" stroke-linecap="round"/>
  <path d="M596 310l11 10-14 7" fill="none" stroke="#FFD568" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
